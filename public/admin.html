<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APEX — Admin · Bookings</title>
  <meta name="theme-color" content="#0b0e0c" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0e0c'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='34' font-weight='700' fill='%233ddc84' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { padding-top: 70px; }
    .admin-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 26px; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .filters input, .filters select {
      background: var(--bg-soft); border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 14px; font-family: inherit;
    }
    .bookings { display: grid; gap: 14px; }
    .bk-card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
      padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start;
    }
    .bk-card strong { font-size: 1.05rem; }
    .bk-meta { color: var(--muted); font-size: 0.88rem; margin-top: 6px; line-height: 1.7; }
    .bk-meta span { color: var(--accent); }
    .bk-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
    .btn-danger { background: none; border: 1px solid rgba(255,122,122,0.4); color: #ff7a7a; border-radius: 10px; padding: 8px 14px; font-size: 0.85rem; }
    .btn-danger:hover { background: rgba(255,122,122,0.12); }
    .empty { text-align: center; color: var(--muted); padding: 60px 0; }
    .count-badge { background: var(--accent-dim); color: var(--accent); border-radius: 999px; padding: 4px 12px; font-size: 0.85rem; font-weight: 600; }
    .admin-actions { display: flex; gap: 10px; align-items: center; }
    #btnExport { font-family: inherit; cursor: pointer; font-size: 0.82rem; padding: 7px 14px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    .stat-card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px;
    }
    .stat-card .s-num { font-size: 1.5rem; font-weight: 700; color: var(--text); }
    .stat-card .s-label { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
    .stat-card.highlight { border-color: var(--accent); }
    .stat-card.highlight .s-num { color: var(--accent); }
    #btnClear { font-family: inherit; cursor: pointer; font-size: 0.82rem; padding: 10px 14px; }
    .btn-danger:disabled { opacity: 0.5; cursor: wait; }
    #btnLogout { font-family: inherit; cursor: pointer; font-size: 0.82rem; padding: 7px 14px; }
    @media (max-width: 860px) {
      .nav-links { position: static; transform: none; flex-direction: row; padding: 0; background: none; border: 0; gap: 18px; }
      .nav-links .nav-cta { padding: 7px 14px; }
    }
    @media (max-width: 640px) {
      .bk-card { grid-template-columns: 1fr; }
      .bk-actions { align-items: stretch; flex-direction: row; justify-content: space-between; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <nav class="nav scrolled">
    <a class="nav-logo" href="/">APEX</a>
    <ul class="nav-links">
      <li><a href="/">Back to site</a></li>
      <li><a href="/api/bookings" target="_blank" rel="noopener">API JSON</a></li>
      <li><button class="btn-ghost btn-sm" id="btnLogout" type="button">Sign out</button></li>
    </ul>
  </nav>

  <main class="container">
    <div class="admin-head">
      <div>

        <h1 class="section-title" style="text-align:left">Bookings</h1>
      </div>
      <div class="admin-actions">
        <span class="count-badge" id="count">0</span>
        <button class="btn-ghost btn-sm" id="btnExport" type="button">Export CSV</button>
      </div>
    </div>
    <div class="stats" id="stats" aria-label="Booking summary">
      <div class="stat-card"><div class="s-num" id="statTotal">0</div><div class="s-label">Total bookings</div></div>
      <div class="stat-card highlight"><div class="s-num" id="statToday">0</div><div class="s-label">Today</div></div>
      <div class="stat-card"><div class="s-num" id="statUpcoming">0</div><div class="s-label">Upcoming</div></div>
      <div class="stat-card"><div class="s-num" id="statPast">0</div><div class="s-label">Past</div></div>
    </div>
    <div class="filters">
      <input id="fSearch" type="search" placeholder="Search name / email / service…" />
      <select id="fService"><option value="">All services</option></select>
      <select id="fTherapist"><option value="">All therapists</option></select>
      <input id="fDate" type="date" aria-label="Filter by date" />
      <select id="fStatus" aria-label="Filter by status">
        <option value="">All dates</option>
        <option value="today">Today</option>
        <option value="upcoming">Upcoming</option>
        <option value="past">Past</option>
      </select>
      <select id="fSort" aria-label="Sort bookings">
        <option value="date-asc">Soonest first</option>
        <option value="date-desc">Latest first</option>
        <option value="created-desc">Newest booked</option>
      </select>
      <button class="btn-ghost btn-sm" id="btnClear" type="button">Clear</button>
    </div>
    <div class="bookings" id="list"></div>
    <p class="empty" id="empty" hidden>No bookings yet.</p>

    <div class="admin-head" style="margin-top:36px">
      <div>

        <h2 class="section-title" style="text-align:left;font-size:1.4rem">Waitlist</h2>
      </div>
      <div class="admin-actions">
        <span class="count-badge" id="wcount">0</span>
      </div>
    </div>
    <div class="bookings" id="wlist"></div>
    <p class="empty" id="wempty" hidden>No one on the waitlist.</p>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
